name: Update NVDA prices
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices since purchase
        run: |
          node -e '
          const BOUGHT = Date.UTC(2026, 10, 13, 18, 31) / 1000;
          const now = Math.floor(Date.now() / 1000);
          const age = (now - BOUGHT) / 86400;
          const iv = age < 55 ? "5m" : age < 700 ? "1h" : "1d";
          const url = "https://query1.finance.yahoo.com/v8/finance/chart/NVDA?period1=" + BOUGHT + "&period2=" + now + "&interval=" + iv;
          fetch(url, { headers: { "User-Agent": "Mozilla/5.0" } }).then(r => r.json()).then(j => {
            const d = j.chart.result[0], ts = d.timestamp || [], cl = d.indicators.quote[0].close || [], m = d.meta;
            const points = ts.map((t, i) => ({ t: t * 1000, p: cl[i] })).filter(x => x.p != null);
            const day = new Date(points[points.length - 1].t).toISOString().slice(0, 10);
            const before = points.filter(x => new Date(x.t).toISOString().slice(0, 10) < day);
            const prevClose = before.length ? before[before.length - 1].p : null;
            const out = { points, price: m.regularMarketPrice, prevClose, time: (m.regularMarketTime || now) * 1000 };
            require("fs").writeFileSync("prices.json", JSON.stringify(out));
          });
          '
      - name: Save
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Update prices"
          git push
